<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#140d0a"><title>Which OTHERSELF Are You? — Bijou Nicole</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0d0706;--panel:#1b100d;--line:rgba(224,177,109,.28);--gold:#f1d0a0;--muted:#d2b89a;--text:#fff7ed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% 12%,rgba(224,177,109,.15),transparent 28%),linear-gradient(#120b09,#080403);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.wrap{width:min(920px,calc(100% - 28px));margin:auto}.top{padding:18px 0;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font:600 1rem/1 "Cinzel";letter-spacing:.16em;color:var(--gold)}.home{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;border:1px solid var(--line);padding:10px 14px;border-radius:999px}.hero{text-align:center;padding:46px 0 24px}.cover{width:min(260px,72vw);margin:0 auto 24px;border-radius:24px;padding:10px;border:1px solid var(--line);background:#24140f}.cover img{width:100%;border-radius:16px;display:block}.kicker{font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}h1{font:500 clamp(2.5rem,8vw,5.7rem)/.95 "Cinzel";margin:10px 0 14px;color:var(--gold)}.hero p{max-width:620px;margin:auto;color:var(--muted);line-height:1.75}.card{border:1px solid var(--line);background:linear-gradient(rgba(47,28,21,.82),rgba(17,10,8,.94));border-radius:28px;padding:clamp(20px,4vw,34px);margin:24px 0 70px;box-shadow:0 26px 70px rgba(0,0,0,.35)}.progress{height:7px;background:#0c0705;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:24px}.progress span{display:block;height:100%;width:20%;background:linear-gradient(90deg,#8d5d2c,var(--gold));transition:.25s}.qnum{font-size:.74rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}h2{font:500 clamp(1.8rem,5vw,3rem)/1.15 "Cinzel";margin:0 0 22px}.answers{display:grid;gap:12px}.answer{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025);color:var(--text);text-align:left;padding:17px 18px;font:500 1rem "DM Sans";cursor:pointer;transition:.18s}.answer:hover,.answer:focus-visible{transform:translateY(-2px);background:rgba(224,177,109,.08);outline:none}.result{text-align:center}.result h2{color:var(--gold);font-size:clamp(2.5rem,7vw,4.5rem)}.result p{color:var(--muted);line-height:1.8;max-width:650px;margin:0 auto 22px}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:10px 14px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-size:.72rem}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}.actions button,.actions a{border:1px solid var(--line);border-radius:999px;background:linear-gradient(#6c461f,#2b170f);color:#fff;padding:12px 17px;cursor:pointer;font:700 .76rem "DM Sans";text-transform:uppercase;letter-spacing:.1em}.hidden{display:none}@media(max-width:560px){.top{align-items:flex-start}.brand{line-height:1.4}}
</style></head><body><div class="wrap"><div class="top"><a class="brand" href="../">BIJOU NICOLE</a><a class="home" href="../">Back to site</a></div><header class="hero"><div class="cover"><img src="../otherself-cover.svg" alt="OTHERSELF EP cover"></div><div class="kicker">fan game · OTHERSELF era</div><h1>Which OTHERSELF Are You?</h1><p>Answer five questions and discover which side of your OTHERSELF energy is showing up today.</p></header><main class="card"><div id="quiz"><div class="progress"><span id="bar"></span></div><div class="qnum" id="qnum"></div><h2 id="question"></h2><div class="answers" id="answers"></div></div><div id="result" class="result hidden"><div class="badge">your OTHERSELF is</div><h2 id="resultName"></h2><p id="resultText"></p><div class="actions"><button id="again" type="button">Play again</button><a href="../party/">Enter release party</a></div></div></main></div><script>
const qs=[
{q:'Pick the energy you walk into a room with.',a:[['Soft but unforgettable','velvet'],['Bright and magnetic','golden'],['Mysterious and observant','midnight'],['Dreamy and unpredictable','daydream']]},
{q:'Your ideal late-night soundtrack feels…',a:[['Slow, intimate, warm','velvet'],['Confident, glossy, addictive','golden'],['Moody, deep, hypnotic','midnight'],['Experimental, floaty, surprising','daydream']]},
{q:'What do you protect the most?',a:[['My heart','velvet'],['My confidence','golden'],['My peace','midnight'],['My imagination','daydream']]},
{q:'Choose an OTHERSELF color world.',a:[['Brown + champagne','velvet'],['Gold + bronze','golden'],['Black + deep wine','midnight'],['Cream + iridescent light','daydream']]},
{q:'What are you becoming?',a:[['More open','velvet'],['More fearless','golden'],['More selective','midnight'],['More myself','daydream']]}
];
const results={velvet:['Velvet Soul','You lead with feeling. Your OTHERSELF is romantic, intuitive, soft-spoken and powerful. You do not need to be loud to leave a mark.'],golden:['Golden Flame','You are stepping into visibility. Your OTHERSELF is confident, radiant, playful and ready to be seen without shrinking.'],midnight:['Midnight Mirror','You notice everything. Your OTHERSELF is private, magnetic, discerning and emotionally deep — mystery is part of the power.'],daydream:['Daydream Frequency','You are impossible to box in. Your OTHERSELF follows instinct, reinvents the rules and turns imagination into a whole world.']};
let i=0,s={velvet:0,golden:0,midnight:0,daydream:0};
const qnum=document.getElementById('qnum'),question=document.getElementById('question'),answers=document.getElementById('answers'),bar=document.getElementById('bar'),quiz=document.getElementById('quiz'),result=document.getElementById('result');
function render(){qnum.textContent=`Question ${i+1} of ${qs.length}`;question.textContent=qs[i].q;bar.style.width=((i+1)/qs.length*100)+'%';answers.innerHTML='';qs[i].a.forEach(([label,key])=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=label;b.addEventListener('click',()=>{s[key]++;i++;i<qs.length?render():finish()});answers.appendChild(b)})}
function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');const best=Object.keys(s).sort((a,b)=>s[b]-s[a])[0];document.getElementById('resultName').textContent=results[best][0];document.getElementById('resultText').textContent=results[best][1];try{localStorage.setItem('bijou_other_self_result',best)}catch(e){}}
document.getElementById('again').addEventListener('click',()=>{i=0;s={velvet:0,golden:0,midnight:0,daydream:0};result.classList.add('hidden');quiz.classList.remove('hidden');render()});render();
</script></body></html>
